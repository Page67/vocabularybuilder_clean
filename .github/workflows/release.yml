name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Require signing secrets
        shell: bash
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_SIGNING_STORE_PASSWORD ANDROID_SIGNING_KEY_ALIAS ANDROID_SIGNING_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required repository secret: $name" >&2
              exit 1
            fi
          done

      - name: Restore release keystore
        shell: bash
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vocabularybuilder-clean.keystore"
          echo "ANDROID_SIGNING_STORE_FILE=$RUNNER_TEMP/vocabularybuilder-clean.keystore" >> "$GITHUB_ENV"

      - name: Test, lint, and build signed release
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --no-daemon

      - name: Verify and package signed APK
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          mkdir -p package
          cp app/build/outputs/apk/release/app-release.apk "package/vocabularybuilder-clean-${GITHUB_REF_NAME}.apk"
          cd package
          sha256sum "vocabularybuilder-clean-${GITHUB_REF_NAME}.apk" > "vocabularybuilder-clean-${GITHUB_REF_NAME}.apk.sha256"

      - name: Upload signed package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vocabularybuilder-clean-${{ github.ref_name }}
          path: package/
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          package/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --title "Vocabulary Builder Clean $GITHUB_REF_NAME"
          --notes-file .github/release-notes/v1.0.0.md

