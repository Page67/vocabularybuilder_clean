name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Test, lint, and package debug APK
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon

      - name: Name package and write checksum
        run: |
          mkdir -p package
          cp app/build/outputs/apk/debug/app-debug.apk package/vocabularybuilder-clean-debug.apk
          cd package
          sha256sum vocabularybuilder-clean-debug.apk > vocabularybuilder-clean-debug.apk.sha256

      - name: Upload APK package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vocabularybuilder-clean-debug-${{ github.sha }}
          path: package/
          if-no-files-found: error
          retention-days: 14

